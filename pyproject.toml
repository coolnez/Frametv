[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frametv"
version = "0.2.0"
description = "Simple local control of a Samsung The Frame TV: apps, Art Mode, power"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "samsungtvws[encrypted]>=3.0.6,<4",
    "wakeonlan>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
images = ["Pillow>=10"]  # downscale museum masters to 4K before upload
dev = ["pytest>=8", "httpx>=0.27", "Pillow>=10"]

[project.scripts]
frametv = "frametv.cli:main"

[tool.setuptools.packages.find]
include = ["frametv*"]

[tool.setuptools.package-data]
frametv = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
